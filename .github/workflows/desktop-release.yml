name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            build_args: --linux --x64
            assets: |
              release/*.AppImage
              release/*.deb
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The test suite exercises Linux-specific local storage behavior; run it
      # once on Linux while still packaging the desktop app on each platform.
      - if: matrix.platform == 'linux'
        run: npm test
      - run: npm run desktop:package -- ${{ matrix.build_args }}
      - uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.assets }}
      - uses: actions/upload-artifact@v4
        with:
          name: paperlens-${{ matrix.platform }}
          path: ${{ matrix.assets }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: paperlens-*
          merge-multiple: true
          path: release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "PaperLens $GITHUB_REF_NAME" --generate-notes
